[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fundus"
version = "1.0.0"
description = "Multi-stage, flat and label-correlation models for multi-label retinal fundus classification"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
